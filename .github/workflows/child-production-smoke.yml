name: Child production smoke
on:
  push:
    paths:
      - '.github/workflows/child-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe v5 reconciled-rain production and canonical route
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            'https://national-garden-water.vercel.app'
            'https://national-garden-water-izworski-gmailcoms-projects.vercel.app'
          )
          passed=0
          public_origin=''
          for attempt in $(seq 1 18); do
            echo "Attempt $attempt"
            for origin in "${candidates[@]}"; do
              page="/tmp/page-$(echo "$origin" | tr -cd 'a-zA-Z0-9').out"
              code="$(curl --silent --show-error --location --max-time 30 --output "$page" --write-out '%{http_code}' "$origin/national-tools/garden-water/" || true)"
              echo "ORIGIN $origin HTTP $code"
              if test "$code" != '200'; then continue; fi
              grep -q 'Should I water my garden today?' "$page" || continue
              grep -q 'Recent observed rain' "$page" || continue
              grep -q '20260904-v5' "$page" || continue
              grep -q 'Michigan Tools' "$page" || continue

              engine="/tmp/engine.js"
              curl --fail --silent --show-error --location --max-time 30 "$origin/assets/national-garden-water-engine.js?v=20260904-v5" > "$engine" || continue
              grep -q 'replayObservedWaterBalance' "$engine" || continue
              grep -q 'selectRecentObservedRain' "$engine" || continue
              grep -q 'NOAA/NWS observed-weather uncertainty range' "$engine" || continue
              if grep -Eq 'taw[[:space:]]*\*[[:space:]]*0\.42|conservative modeled starting reserve' "$engine"; then
                echo 'Synthetic moisture baseline is still present.'
                continue
              fi

              curl --fail --silent --show-error --location --max-time 30 "$origin/api/national-garden-water?health=1" | grep -q 'national-garden-water' || continue
              api="/tmp/context.json"
              curl --fail --silent --show-error --location --max-time 45 "$origin/api/national-garden-water?lat=43.60&lon=-83.90" > "$api" || continue
              node - "$api" <<'NODE' || continue
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(j.observedHistory?.source!=='NOAA NCEI Daily Summaries') throw new Error('NOAA observed history missing');
          if(!j.observedHistory?.station) throw new Error('NOAA station missing');
          if((j.observedHistory?.coveredDays||0)<7) throw new Error('insufficient NOAA observed days');
          if(!Array.isArray(j.observedHistory?.days)||!j.observedHistory.days.length) throw new Error('NOAA daily rows missing');
          if(!j.recentRain?.source?.includes('NWS')) throw new Error('NWS current rain source missing');
          if(j.forecastRain?.source!=='NWS quantitative precipitation forecast') throw new Error('NWS QPF source missing');
          console.log(JSON.stringify({station:j.observedHistory.station,coveredDays:j.observedHistory.coveredDays,totalRain7d:j.observedHistory.totalRain7d,recentRain:j.recentRain.inches,forecast24:j.forecastRain.in24}));
          NODE
              public_origin="$origin"
              passed=1
              break 2
            done
            sleep 10
          done
          test "$passed" = '1'
          echo "PUBLIC_ORIGIN=$public_origin"

          canonical='https://chrisizworski.com'
          for attempt in $(seq 1 12); do
            page='/tmp/canonical-garden-water.out'
            code="$(curl --silent --show-error --location --max-time 30 --output "$page" --write-out '%{http_code}' "$canonical/national-tools/garden-water/" || true)"
            echo "CANONICAL attempt $attempt HTTP $code"
            if test "$code" = '200' && grep -q 'Should I water my garden today?' "$page" && grep -q 'Recent observed rain' "$page" && grep -q '20260904-v5' "$page"; then
              engine='/tmp/canonical-engine.js'
              curl --fail --silent --show-error --location --max-time 30 "$canonical/assets/national-garden-water-engine.js?v=20260904-v5" > "$engine"
              grep -q 'replayObservedWaterBalance' "$engine"
              grep -q 'selectRecentObservedRain' "$engine"
              ! grep -Eq 'taw[[:space:]]*\*[[:space:]]*0\.42|conservative modeled starting reserve' "$engine"
              api='/tmp/canonical-context.json'
              curl --fail --silent --show-error --location --max-time 45 "$canonical/api/national-garden-water?lat=43.60&lon=-83.90" > "$api"
              node - "$api" <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(j.observedHistory?.source!=='NOAA NCEI Daily Summaries') throw new Error('canonical NOAA observed history missing');
          if((j.observedHistory?.coveredDays||0)<7) throw new Error('canonical NOAA history incomplete');
          console.log(JSON.stringify({canonicalStation:j.observedHistory.station,canonicalCoveredDays:j.observedHistory.coveredDays}));
          NODE
              echo 'Child production and canonical v5 reconciled-rain smoke passed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Canonical route did not serve v5 reconciled-rain build.'
          exit 1
