name: Child production smoke
on:
  push:
    paths:
      - '.github/workflows/child-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe child production aliases
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            'https://national-garden-water.vercel.app'
            'https://national-garden-water-izworski-gmailcoms-projects.vercel.app'
            'https://national-garden-water-5noqwj0cs-izworski-gmailcoms-projects.vercel.app'
          )
          passed=0
          for origin in "${candidates[@]}"; do
            file="/tmp/page-$(echo "$origin" | tr -cd 'a-zA-Z0-9').out"
            code="$(curl --silent --show-error --location --max-time 30 --output "$file" --write-out '%{http_code}' "$origin/national-tools/garden-water/" || true)"
            echo "ORIGIN $origin HTTP $code"
            head -c 180 "$file" || true
            echo
            if test "$code" = '200' && grep -q 'Should I water the garden today?' "$file"; then
              echo "PUBLIC_ORIGIN=$origin"
              curl --fail --silent --show-error --location --max-time 30 "$origin/assets/national-garden-water-page.js?v=20260903-v1" | grep -q 'computeDecision'
              curl --fail --silent --show-error --location --max-time 30 "$origin/api/national-garden-water?health=1" | grep -q 'national-garden-water'
              curl --fail --silent --show-error --location --max-time 30 "$origin/api/national-geocode?q=48706" | grep -q '48706'
              passed=1
              break
            fi
          done
          test "$passed" = '1'
          echo 'Child production smoke passed.'
