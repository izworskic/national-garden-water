name: Probe NOAA station discovery
on:
  push:
    branches: [agent/observed-water-ledger]
    paths: ['.github/workflows/live-noaa-ledger-smoke.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect NOAA search response for Bay City Michigan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const qs=new URLSearchParams({dataset:'daily-summaries',startDate:'2026-08-21T00:00:00',endDate:'2026-09-03T23:59:59',bbox:'44.0000,-84.3000,43.2000,-83.4000',dataTypes:'PRCP,TMAX,TMIN',limit:'25',offset:'0'});
          const r=await fetch(`https://www.ncei.noaa.gov/access/services/search/v1/data?${qs}`);
          const text=await r.text();
          console.log('STATUS',r.status);
          console.log(text.slice(0,12000));
          if(!r.ok) process.exit(1);
          const j=JSON.parse(text);
          if(!Array.isArray(j.results)||!j.results.length) throw new Error('No NOAA search results');
          console.log('FIRST_RESULT',JSON.stringify(j.results[0],null,2));
          NODE
