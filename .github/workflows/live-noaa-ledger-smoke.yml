name: Finalize live NOAA observed history
on:
  push:
    branches: [agent/observed-water-ledger]
    paths: ['.github/workflows/live-noaa-ledger-smoke.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observed-water-ledger
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire NOAA search then station data download
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('api/national-garden-water.js')
          s=p.read_text()
          pattern=r"async function getObservedHistory\(lat,lon,now=Date\.now\(\),timeZone='UTC'\)\{[\s\S]*?\n\}\n\nexport function summarizeStationRain"
          replacement=r'''export async function getObservedHistory(lat,lon,now=Date.now(),timeZone='UTC'){
            const today=ymdInZone(now,timeZone),endDate=shiftYmd(today,-1),startDate=shiftYmd(endDate,-13);
            let lastError=null;
            for(const span of [0.35,0.8]){
              try{
                const north=(Number(lat)+span).toFixed(4),south=(Number(lat)-span).toFixed(4),west=(Number(lon)-span).toFixed(4),east=(Number(lon)+span).toFixed(4);
                const bbox=`${north},${west},${south},${east}`;
                const discoveryQs=new URLSearchParams({
                  dataset:'daily-summaries',startDate:`${startDate}T00:00:00`,endDate:`${endDate}T23:59:59`,
                  bbox,dataTypes:'PRCP,TMAX,TMIN',limit:'25',offset:'0'
                });
                const discovery=await fetchJson(`https://www.ncei.noaa.gov/access/services/search/v1/data?${discoveryQs}`,{signal:timeout(10000)});
                const required=['PRCP','TMAX','TMIN'];
                const candidates=(discovery?.results||[]).map(result=>{
                  const stationMeta=result?.stations?.[0]||{};
                  const station=stationMeta.id||String(result?.name||'').replace(/\.csv$/i,'');
                  const coords=result?.location?.coordinates||result?.centroid||result?.boundingPoints?.[0]?.coordinates||[];
                  const slon=Number(coords[0]),slat=Number(coords[1]);
                  const ids=new Set((stationMeta.dataTypes||[]).map(x=>x.id));
                  const hasAll=required.every(x=>ids.has(x));
                  const distanceMiles=Number.isFinite(slat)&&Number.isFinite(slon)?haversineMiles(Number(lat),Number(lon),slat,slon):999;
                  return {station,name:stationMeta.name||station,latitude:slat,longitude:slon,distanceMiles,hasAll};
                }).filter(x=>x.station&&x.hasAll&&Number.isFinite(x.distanceMiles)).sort((a,b)=>a.distanceMiles-b.distanceMiles).slice(0,4);
                if(!candidates.length)throw new Error('no NOAA daily-summary stations with PRCP/TMAX/TMIN');

                const settled=await Promise.allSettled(candidates.map(async candidate=>{
                  const dataQs=new URLSearchParams({
                    dataset:'daily-summaries',stations:candidate.station,startDate,endDate,
                    format:'json',units:'standard',includeStationLocation:'true',includeStationName:'true',
                    dataTypes:'PRCP,TMAX,TMIN'
                  });
                  const rows=await fetchJson(`https://www.ncei.noaa.gov/access/services/data/v1?${dataQs}`,{signal:timeout(12000)});
                  if(!Array.isArray(rows))throw new Error(`${candidate.station} daily rows unavailable`);
                  return rows.map(row=>({
                    ...row,
                    STATION:row.STATION||candidate.station,
                    NAME:row.NAME||candidate.name,
                    LATITUDE:row.LATITUDE??candidate.latitude,
                    LONGITUDE:row.LONGITUDE??candidate.longitude
                  }));
                }));
                const rows=settled.filter(x=>x.status==='fulfilled').flatMap(x=>x.value);
                if(!rows.length)throw new Error('NOAA station downloads returned no rows');
                const chosen=chooseNceiDailyStation(rows,lat,lon);
                if(!chosen)throw new Error('no usable NOAA daily-summary station');
                const days=chosen.rows.map(r=>{
                  const date=String(r.DATE||'').slice(0,10),rain=Number(r.PRCP),tmax=Number(r.TMAX),tmin=Number(r.TMIN);
                  if(!date||![rain,tmax,tmin].every(Number.isFinite))return null;
                  const referenceEtIn=observedHargreavesEtIn(tmax,tmin,lat,date);
                  if(!Number.isFinite(referenceEtIn))return null;
                  return {date,rainIn:Math.max(0,rain),tmaxF:tmax,tminF:tmin,referenceEtIn,source:'NOAA NCEI Daily Summaries'};
                }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
                const coveredDays=new Set(days.map(x=>x.date)).size;
                if(coveredDays<3)throw new Error('insufficient complete NOAA daily-summary days');
                const sevenStart=shiftYmd(today,-7);
                const days7=days.filter(x=>x.date>=sevenStart&&x.date<=endDate);
                const totalRain7d=days7.reduce((a,b)=>a+b.rainIn,0),totalRain14d=days.reduce((a,b)=>a+b.rainIn,0);
                return {
                  days,coveredDays,requestedDays:14,observedDays7d:new Set(days7.map(x=>x.date)).size,
                  totalRain7d:round(totalRain7d),totalRain14d:round(totalRain14d),
                  station:chosen.station,stationName:chosen.name,distanceMiles:chosen.distanceMiles,
                  confidence:coveredDays>=12?'high':coveredDays>=7?'medium':'low',
                  source:'NOAA NCEI Daily Summaries',startDate,endDate
                };
              }catch(error){lastError=error;}
            }
            return {days:[],coveredDays:0,requestedDays:14,observedDays7d:0,totalRain7d:0,totalRain14d:0,station:null,stationName:null,distanceMiles:null,confidence:'low',source:'NOAA NCEI Daily Summaries unavailable',startDate,endDate,error:String(lastError?.message||lastError||'history unavailable')};
          }

          export function summarizeStationRain'''
          s2,n=re.subn(pattern,replacement,s,count=1)
          assert n==1, f'expected one getObservedHistory block, replaced {n}'
          p.write_text(s2)

          p=Path('public/assets/national-garden-water-page.js')
          s=p.read_text()
          old="""function observedRainLastSevenDays(){
            const past=(context.observedHistory?.days||[]).slice(-6).reduce((sum,d)=>sum+Number(d.rainIn||0),0);
            return past+Number(context.recentRain?.todayIn||0);
          }"""
          new="""function observedRainLastSevenDays(){
            const history=context.observedHistory||{};
            return {amount:Number(history.totalRain7d||0)+Number(context.recentRain?.todayIn||0),covered:Number(history.observedDays7d||0)};
          }"""
          assert old in s
          s=s.replace(old,new)
          old2="""  const rainShown=setup.rainGauge==null?observedRainLastSevenDays():setup.rainGauge;
            $('#recent-rain').textContent=setup.rainGauge==null?`${fmt(rainShown)} in`:`${fmt(rainShown)} in · your gauge`;"""
          new2="""  const observedRain=observedRainLastSevenDays();
            const rainShown=setup.rainGauge==null?observedRain.amount:setup.rainGauge;
            $('#recent-rain').textContent=setup.rainGauge==null?`${fmt(rainShown)} in · ${observedRain.covered}/7 NOAA days + today`:`${fmt(rainShown)} in · your gauge`;"""
          assert old2 in s
          p.write_text(s.replace(old2,new2))

          p=Path('public/national-tools/garden-water/index.html')
          s=p.read_text().replace('<span>Observed rain, 7d</span>','<span>Recent observed rain</span>')
          p.write_text(s)

          p=Path('tests/national-garden-water.test.js')
          s=p.read_text().replace("assert.match(html,/Observed rain, 7d/);","assert.match(html,/Recent observed rain/);")
          s=s.replace("assert.match(js,/dataset:'daily-summaries'/);","assert.match(js,/dataset:'daily-summaries'/);assert.match(js,/search\\/v1\\/data/);assert.match(js,/stations:candidate.station/);")
          p.write_text(s)
          PY
      - name: Verify repository
        run: npm test
      - name: Exercise production NOAA history function against Bay City
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {getObservedHistory}=await import('./api/national-garden-water.js');
          const h=await getObservedHistory(43.60,-83.90,Date.parse('2026-09-04T12:00:00Z'),'America/Detroit');
          console.log(JSON.stringify({station:h.station,stationName:h.stationName,distanceMiles:h.distanceMiles,coveredDays:h.coveredDays,observedDays7d:h.observedDays7d,totalRain7d:h.totalRain7d,startDate:h.startDate,endDate:h.endDate,lastDay:h.days?.at(-1)},null,2));
          if(h.source!=='NOAA NCEI Daily Summaries') throw new Error(h.error||'NOAA history source unavailable');
          if(h.coveredDays<7) throw new Error(`Only ${h.coveredDays} complete NOAA days`);
          if(!h.station) throw new Error('NOAA station missing');
          NODE
      - name: Exercise live NWS current and forecast discovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://api.weather.gov/points/43.60,-83.90',{headers:{'User-Agent':'chrisizworski.com garden-water final smoke'}});
          if(!r.ok)throw new Error(`NWS ${r.status}`);
          const p=await r.json();
          const s=await fetch(p.properties.observationStations,{headers:{'User-Agent':'chrisizworski.com garden-water final smoke'}}).then(x=>x.json());
          if(!p.properties.forecastGridData||!s.features?.[0]?.id)throw new Error('NWS current/forecast links missing');
          console.log(JSON.stringify({grid:p.properties.gridId,timeZone:p.properties.timeZone,nearestObservationStation:s.features[0].id,forecastGrid:p.properties.forecastGridData}));
          NODE
      - name: Commit durable NOAA integration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/live-noaa-ledger-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/national-garden-water.js public/assets/national-garden-water-page.js public/national-tools/garden-water/index.html tests/national-garden-water.test.js .github/workflows/live-noaa-ledger-smoke.yml
          git commit -m 'Use discovered NOAA stations for observed water history'
          git push
