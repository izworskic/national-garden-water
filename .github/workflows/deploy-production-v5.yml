name: Deploy Garden Water v5 production
on:
  push:
    paths:
      - '.github/workflows/deploy-production-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production source
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          grep -q '20260904-v5' public/national-tools/garden-water/index.html
          grep -q 'selectRecentObservedRain' public/assets/national-garden-water-engine.js
      - name: Require configured Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN_NOT_CONFIGURED'
            exit 2
          fi
      - name: Deploy exact repository to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest deploy . --prod --yes --project national-garden-water --scope izworski-gmailcoms-projects --token "$VERCEL_TOKEN"
