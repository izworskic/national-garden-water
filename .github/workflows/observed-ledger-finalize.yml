name: Finalize observed weather ledger
on:
  push:
    branches: [agent/observed-water-ledger]
    paths: ['.github/workflows/observed-ledger-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observed-water-ledger
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize cache keys and conservative missing-data guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/assets/national-garden-water-engine.js')
          s=p.read_text()
          old="const definitelyWet=maxDepletion<trigger*0.90;"
          new="const definitelyWet=historyConfidence!=='low' && maxDepletion<trigger*0.90;"
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('public/assets/national-garden-water-page.js')
          s=p.read_text()
          old="import {computeDecision,SOILS} from './national-garden-water-engine.js';"
          new="import {computeDecision,SOILS} from './national-garden-water-engine.js?v=20260904-v4';"
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('public/national-tools/garden-water/index.html')
          s=p.read_text()
          s=s.replace('national-garden-water.css?v=20260904-v3','national-garden-water.css?v=20260904-v4')
          s=s.replace('national-garden-water-page.js?v=20260904-v3','national-garden-water-page.js?v=20260904-v4')
          s=s.replace('<span>Rain, past 72h</span>','<span>Observed rain, 7d</span>')
          s=s.replace('The tool checks recent National Weather Service rain, the next rain, atmospheric water demand, and mapped soil — then tells you whether a typical established vegetable garden needs water today.','The tool replays actual NOAA observed rain and temperatures, checks today’s water demand and the NWS forecast, then tells you whether a typical established vegetable garden needs water today.')
          p.write_text(s)
          PY
      - name: Verify observed-ledger behavior
        run: npm test
      - name: Commit finalized implementation
        shell: bash
        run: |
          rm .github/workflows/observed-ledger-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/national-garden-water-engine.js public/assets/national-garden-water-page.js public/national-tools/garden-water/index.html .github/workflows/observed-ledger-finalize.yml
          git commit -m 'Finalize NOAA observed weather ledger'
          git push
