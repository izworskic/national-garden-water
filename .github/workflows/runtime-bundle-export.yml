name: Export Garden Water production runtime bundle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runtime-bundle-export.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify merged runtime before export
        run: npm test
      - name: Stage exact production runtime
        shell: bash
        run: |
          mkdir -p runtime/api runtime/scripts runtime/public/assets runtime/public/data runtime/public/national-tools/garden-water
          cp package.json vercel.json runtime/
          cp api/national-garden-water.js runtime/api/
          cp scripts/inject-ga4.mjs runtime/scripts/
          cp public/assets/national-garden-water-engine.js runtime/public/assets/
          cp public/assets/national-garden-water-page.js runtime/public/assets/
          cp public/assets/national-garden-water.css runtime/public/assets/
          cp public/data/national-garden-water-crops.json runtime/public/data/
          cp public/national-tools/garden-water/index.html runtime/public/national-tools/garden-water/
          grep -q 'replayObservedWaterBalance' runtime/public/assets/national-garden-water-engine.js
          ! grep -Eq 'taw[[:space:]]*\*[[:space:]]*0\.42|conservative modeled starting reserve' runtime/public/assets/national-garden-water-engine.js
          grep -q 'search/v1/data' runtime/api/national-garden-water.js
          grep -q 'stations:candidate.station' runtime/api/national-garden-water.js
      - uses: actions/upload-artifact@v4
        with:
          name: garden-water-production-runtime
          path: runtime/
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary export workflow
        shell: bash
        run: |
          rm .github/workflows/runtime-bundle-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/runtime-bundle-export.yml
          git commit -m 'Remove temporary runtime bundle export workflow'
          git push
